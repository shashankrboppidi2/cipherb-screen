name: Cipher B gold-dot screen — crypto (24/7)

# Crypto 1h bars close every hour. Run 4 minutes past each hour, every day.
on:
  schedule:
     - cron: '4 12-23,0-4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GOLD_UNIVERSE: crypto
          ET_WINDOW: '09:00-23:10'
          GOLD_MAIL_ALWAYS: '0'        # '1' = e-mail every hour; '0' = only when a gold dot fires
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python gold_screen.py
      - name: Commit results
        run: |
          git config user.name  "cipherb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "$(date -u +%FT%H:%M) gold-crypto"
          git pull --rebase && git push
