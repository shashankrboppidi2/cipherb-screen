name: Cipher B gold-dot screen (every 2h)

# Fires every hour at :35 from 13:35 to 21:35 UTC; gold_screen.py keeps only the runs that land at
# 10:35, 12:35, 14:35 and 16:35 ET (4 per day, summer or winter). The extra firings exit in under a minute.
on:
  schedule:
    - cron: '35 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ET_WINDOW: ${{ github.event_name == 'workflow_dispatch' && '' || '10:30-16:59' }}
          ET_HOURS:  ${{ github.event_name == 'workflow_dispatch' && '' || '10,11,12,13,14,15,16' }}
          GOLD_MAIL_ALWAYS: '0'        # '1' = e-mail every run; '0' = only when a gold dot fires
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python gold_screen.py
      - name: Commit results
        run: |
          git config user.name  "cipherb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/
          git diff --quiet --cached || git commit -m "$(date -u +%FT%H:%M) gold"
          git pull --rebase && git push
